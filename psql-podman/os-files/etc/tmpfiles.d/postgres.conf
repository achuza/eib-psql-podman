# Ensure the bind-mount source for postgres.container exists on every boot.
# Without this the Podman bind mount fails with "no such file or directory"
# on systems where combustion didn't run (re-image, snapshot rollback, etc.).
#
# If you change Volume= in os-files/etc/containers/systemd/postgres.container
# to use a different host path, add a matching `d` entry here so the
# directory is created before postgres.service starts.
#
# Format: d <path> <mode> <user> <group> <age> -- see `man tmpfiles.d`.
# `d` creates the directory if missing but does NOT wipe it if it exists,
# so existing PGDATA is preserved across reboots.
d /var/lib/postgres      0755 root root -
d /var/lib/postgres/data 0700 root root -
