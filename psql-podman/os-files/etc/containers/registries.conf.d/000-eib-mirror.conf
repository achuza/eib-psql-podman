# Route pulls of registry.suse.com through the on-host Hauler registry
# that EIB stands up at localhost:6545 (eib-embedded-registry.service).
# Without this, Podman bypasses the embedded artefact and tries the
# internet, which fails on air-gapped or first-boot-without-network hosts.

[[registry]]
prefix = "registry.suse.com"
location = "registry.suse.com"

[[registry.mirror]]
location = "localhost:6545"
insecure = true
